<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人主页</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="profile-card">
    <p class="eyebrow">Hello, I'm Alex</p>
    <h1>欢迎来到我的个人主页</h1>
    <p class="intro">
      我热爱设计、技术与创造，喜欢把简单的想法打磨成清晰、温暖且实用的数字体验。
    </p>
    <button id="greetingButton" type="button">给我一个问候</button>
    <p id="message" class="message" aria-live="polite"></p>
  </main>
  <script src="script.js"></script>
</body>
</html>
